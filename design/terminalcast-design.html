<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerminalCast Design</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Theme tokens. Only surfaces + accent change per theme; semantic colors (up/down/cold) stay fixed. */
.phone{--bg:#0D0E12;--card:#14161C;--raised:#171A21;--line:#262A33;--line2:#1d2028;--strong:#333845;
  --ink:#E6E8EC;--body:#C4C8D0;--muted:#7C8494;--acc:#FFB000;--acc-hi:#FFC638;--acc-soft:rgba(255,176,0,.14);--acc-glow:rgba(255,176,0,.25);
  --up:#00FF66;--down:#FF3B4E;--cold:#22D3EE;--orange:#FF8A3D}
.phone[data-theme="arctic"]{--bg:#0A1016;--card:#101820;--raised:#142029;--line:#1F3340;--line2:#172833;--strong:#2B4655;--muted:#7C93A3;
  --acc:#22D3EE;--acc-hi:#67E3F5;--acc-soft:rgba(34,211,238,.14);--acc-glow:rgba(34,211,238,.25);--cold:#FFB000}
.phone[data-theme="violet"]{--bg:#0E0C14;--card:#16131F;--raised:#1B1727;--line:#2B2540;--line2:#211C33;--strong:#3A3256;--muted:#8A82A6;
  --acc:#A78BFA;--acc-hi:#C4B0FF;--acc-soft:rgba(167,139,250,.16);--acc-glow:rgba(167,139,250,.28)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#07080B;color:#E6E8EC;font-family:'IBM Plex Sans',Helvetica,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
::-webkit-scrollbar{display:none}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes drop{from{transform:translateY(-120%)}to{transform:translateY(0)}}

.page{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start;padding:40px 24px;min-height:100vh}
.flow{width:200px;display:flex;flex-direction:column;gap:6px;position:sticky;top:40px}
.flow h3,.ds h3{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#7C8494;margin:14px 0 4px}
.flow button{text-align:left;background:#14161C;border:1px solid #262A33;border-radius:8px;padding:9px 12px;font:500 12px 'IBM Plex Mono',monospace;color:#C4C8D0}
.flow button.on{border-color:#FFB000;color:#FFB000;background:rgba(255,176,0,.12)}
.flow .brand{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#FFB000}

.device{position:relative;width:414px;height:868px;flex:none;border-radius:64px;background:#1a1c22;padding:12px;box-shadow:0 0 0 2px #2c2f38,0 40px 90px rgba(0,0,0,.7)}
.phone{position:relative;width:390px;height:844px;border-radius:52px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;color:var(--ink)}
.status{height:54px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px 8px;font:600 15px 'IBM Plex Sans',sans-serif;position:relative}
.status .notch{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000}
.status .r{font:500 11px 'IBM Plex Mono',monospace}
.body{flex:1;min-height:0;overflow:auto;position:relative}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:30}

.mono{font-family:'IBM Plex Mono',monospace}
.lbl{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--acc)}
.sub{font:500 10px 'IBM Plex Mono',monospace;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center}
.cell{background:var(--bg);padding:9px 10px}
.cell .k{font:500 9px 'IBM Plex Mono',monospace;color:var(--muted)}
.cell .v{font:500 12px 'IBM Plex Mono',monospace;margin-top:3px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:8px;overflow:hidden}

.chip{flex:none;height:36px;padding:0 14px;font:500 12px 'IBM Plex Mono',monospace;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.btn{height:48px;border-radius:12px;border:1px solid var(--strong);background:transparent;font:500 13px 'IBM Plex Mono',monospace;width:100%}
.btn.pri{background:var(--acc);border:0;color:var(--bg);font:600 15px 'IBM Plex Sans',sans-serif;box-shadow:0 0 28px var(--acc-glow)}
.btn.pri:active{background:var(--acc-hi)}
.btn.out{border-color:var(--acc);color:var(--acc)}
.btn.small{height:44px;width:auto;padding:0 14px;border-radius:10px;font-size:12px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--muted)}
.field input{height:48px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px;color:var(--ink);font:400 14px 'IBM Plex Mono',monospace;outline:0}
.field input:focus{border-color:var(--acc)}
.err{display:none;padding:10px 12px;border:1px solid var(--down);background:rgba(255,59,78,.1);border-radius:10px;font:500 12px 'IBM Plex Mono',monospace;color:var(--down)}
.err.show{display:block}

.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);height:84px;padding:6px 4px 26px;background:color-mix(in srgb,var(--bg) 96%,transparent);border-top:1px solid var(--line)}
.tabbar button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)}
.tabbar button.on{color:var(--acc)}
.tabbar .ic{font:600 16px 'IBM Plex Mono',monospace}
.tabbar .tl{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.08em}

.cmd{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.cmd .p{font:600 13px 'IBM Plex Mono',monospace;color:var(--acc)}
.cmd input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:400 13px 'IBM Plex Mono',monospace}
.live{display:flex;align-items:center;gap:5px;font:600 10px 'IBM Plex Mono',monospace;color:var(--up)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--up);animation:pulse 1.6s infinite}
.ticker{height:30px;flex:none;overflow:hidden;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center}
.ticker .t{display:flex;width:max-content;animation:tape 28s linear infinite}
.ticker .i{display:flex;gap:6px;padding:0 16px;border-right:1px solid var(--line);font:500 12px 'IBM Plex Mono',monospace;white-space:nowrap}

.item{display:grid;grid-template-columns:10px 1fr auto auto;gap:12px;align-items:center;min-height:64px;padding:8px 8px 8px 16px;border-top:1px solid var(--line2);border-left:3px solid transparent}
.item.on{border-left-color:var(--acc);background:var(--raised)}
.item .nm{font:500 14px 'IBM Plex Sans',sans-serif}
.x{width:44px;height:44px;border:0;background:transparent;color:var(--muted);font:500 18px 'IBM Plex Mono',monospace}

.sw{position:relative;width:48px;height:28px;border-radius:14px;border:1px solid var(--strong);background:var(--bg);flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
.sw.on{background:var(--acc-soft);border-color:var(--acc)}
.sw.on::after{left:23px;background:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:36px;background:var(--card);border:0;border-right:1px solid var(--line);font:500 11px 'IBM Plex Mono',monospace;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc-soft);color:var(--acc)}
.set{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:6px 14px;border-top:1px solid var(--line2);gap:12px}
.set:first-of-type{border-top:0}
.set .n{font:500 14px 'IBM Plex Sans',sans-serif}
.set .d{font:400 11px 'IBM Plex Mono',monospace;color:var(--muted);margin-top:2px}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.group .gh{padding:12px 14px 8px}
.theme{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.theme.on{border-color:var(--acc)}
.theme .sq{width:100%;height:28px;border-radius:6px;display:flex;overflow:hidden}
.theme .sq i{flex:1}
.theme span{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.06em}

.push{position:absolute;left:10px;right:10px;top:8px;z-index:40;background:rgba(30,32,40,.97);border:1px solid var(--strong);border-radius:20px;padding:12px 14px;display:flex;gap:10px;animation:drop .35s ease-out;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.push .ico{width:36px;height:36px;border-radius:9px;background:var(--acc);color:var(--bg);display:flex;align-items:center;justify-content:center;font:600 15px 'IBM Plex Mono',monospace;flex:none}
.sheet-scrim{position:absolute;inset:0;background:rgba(5,6,8,.72);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:86%;overflow:auto;background:var(--card);border-top:2px solid var(--acc);border-radius:24px 24px 0 0;padding-bottom:34px}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;font:400 10px 'IBM Plex Mono',monospace;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;margin-right:5px}

.ds{width:420px;max-width:100%;display:flex;flex-direction:column;gap:6px}
.ds .sw8{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ds .sc{border:1px solid #262A33;border-radius:8px;overflow:hidden;background:#14161C}
.ds .sc div:first-child{height:34px}
.ds .sc div:last-child{padding:6px 8px;font:600 10px 'IBM Plex Mono',monospace}
.ds .sc small{display:block;font:400 10px 'IBM Plex Sans',sans-serif;color:#7C8494;margin-top:2px}
.ds p{font:400 13px/1.45 'IBM Plex Sans',sans-serif;color:#C4C8D0;margin:0 0 6px}
</style>
</head>

    <div class="set"><div><div class="n">Quiet hours</div><div class="d">10 PM – 6 AM</div></div><button class="sw ${S.quiet?'on':''}" aria-label="Quiet hours" ${e('toggle','quiet')}></button></div></div>
   <div class="group"><div class="gh"><span class="lbl">ABOUT</span></div><div class="set"><div class="n">Version</div><span class="sub">1.0.0 (midterm)</span></div><div class="set"><div class="d" style="margin:0">Illustrative data. Not investment advice.</div></div></div>
   <button class="btn" style="color:var(--down);border-color:var(--down)" ${e('logout')}>Log out</button></div>`;
}

/* ---------- render ---------- */
function render(){
  const ph=document.getElementById('phone'); ph.dataset.theme=S.theme;
  const scr=document.getElementById('body'), keep=scr?scr.scrollTop:0;
  if(S.screen==='login'||S.screen==='signup') ph.innerHTML=authScreen(S.screen);
  else {
    const map={home:home,map:mapScreen,cities:cities,alerts:alerts,settings:settings};
    ph.innerHTML=chrome(map[S.tab]())+(S.arb?arbSheet():'');
    const b=document.getElementById('body'); if(b&&S.keepScroll) b.scrollTop=keep;
  }
  S.keepScroll=false;
  document.querySelectorAll('#flow button').forEach(b=>b.classList.toggle('on',b.dataset.go===(S.arb?'radar':S.screen==='app'?S.tab:S.screen)));
  const q=document.getElementById('q'); if(q) q.addEventListener('input',search);
}
function search(ev){
  const t=ev.target.value.trim().toLowerCase(), out=document.getElementById('results');
  const hits=t?Object.entries(C).filter(([k,c])=>(k+c.name+c.hub).toLowerCase().includes(t)).slice(0,4):[];
  out.innerHTML=hits.length?`<div style="background:var(--card);border-bottom:1px solid var(--strong)">${hits.map(([k,c])=>`<div ${e('open',k)} style="display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2);font:500 13px 'IBM Plex Mono';cursor:pointer"><span><span style="color:var(--acc)">${k}</span> &nbsp;${c.name}</span><span style="color:var(--muted)">${S.saved.includes(k)?'★':''}</span></div>`).join('')}</div>`:(t?`<div class="sub" style="padding:12px 16px;background:var(--card)">No match for “${ev.target.value}”</div>`:'');
}
function go(name){
  if(name==='login'||name==='signup'){S.screen=name;S.arb=false;}
  else {S.screen='app';S.arb=name==='radar';S.tab=name==='radar'?'map':name;}
  S.toast=null; render();
}
function fail(msg){const el=document.getElementById('err'); el.textContent=msg; el.classList.add('show');}
const val=id=>(document.getElementById(id)||{}).value||'';

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a, x=t.dataset.x;
  if(a==='stop') return;
  S.keepScroll=true;
  switch(a){
    case 'goto': go(x); return;
    case 'doLogin': if(!val('f-email')||!val('f-pass')) return fail('Enter your email and password.');
      if(!/^\S+@\S+\.\S+$/.test(val('f-email'))) return fail('That email address looks invalid.');
      S.user.email=val('f-email'); S.user.name=val('f-email').split('@')[0]; go('home'); return;
    case 'doSignup': if(!val('f-user')||!val('f-email')||!val('f-pass')) return fail('All fields are required.');
      if(!/^\S+@\S+\.\S+$/.test(val('f-email'))) return fail('That email address looks invalid.');
      if(val('f-pass').length<8) return fail('Password must be at least 8 characters.');
      if(val('f-pass')!==val('f-pass2')) return fail('Passwords do not match.');
      S.user={name:val('f-user'),email:val('f-email')}; go('home'); return;
    case 'logout': go('login'); return;
    case 'tab': S.tab=x; S.keepScroll=false; break;
    case 'city': S.city=x; break;
    case 'open': S.city=x; S.tab='home'; S.keepScroll=false; break;
    case 'layer': S.layer=x; break;
    case 'region': S.region=x; break;
    case 'pin': {const n=NODES[x]; if(n[2]) S.city=n[2]; S.region=n[0]; break;}
    case 'closeregion': S.region=null; break;
    case 'opencity': if(x) S.city=x; S.tab='home'; S.keepScroll=false; break;
    case 'savehub': if(x) S.saved=S.saved.includes(x)?S.saved.filter(k=>k!==x):[...S.saved,x]; break;
    case 'add': S.saved.push(x); S.rules[x]=true; break;
    case 'remove': S.saved=S.saved.filter(k=>k!==x); if(S.city===x&&S.saved.length) S.city=S.saved[0]; break;
    case 'arb': S.arb=true; break;
    case 'closearb': S.arb=false; break;
    case 'toggle': S[x]=!S[x]; break;
    case 'rule': S.rules[x]=!S.rules[x]; break;
    case 'alertcity': S.rules[x]=!S.rules[x]; break;
    case 'esi': S.esiMin=+x; break;
    case 'set': {const [k,val2]=x.split(':'); S[k]=val2; break;}
    case 'theme': S.theme=x; break;
    case 'testpush': {const k=S.saved.find(k=>S.rules[k]); S.toast=k; setTimeout(()=>{S.toast=null;S.keepScroll=true;render();},4500); break;}
    case 'dismiss': S.toast=null; break;
  }
  render();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.arb){S.arb=false;render();}});

/* ---------- side panels ---------- */
const FLOW=[['login','1 · Log in'],['signup','2 · Sign up'],['home','3 · Home (city weather + ESI)'],['map','4 · Map (4 layers)'],['radar','5 · Arbitrage Radar sheet'],['cities','6 · My Cities (add / save)'],['alerts','7 · Alerts (push rules)'],['settings','8 · Settings + themes']];
document.getElementById('flow').innerHTML=`<div class="brand">TERMINALCAST · SCREENS</div>`+FLOW.map(f=>`<button data-go="${f[0]}">${f[1]}</button>`).join('')+`<h3>NOTE</h3><div style="font:400 11px/1.5 'IBM Plex Sans';color:#7C8494">Interactive mock. Try bad credentials, the add/remove city flow, the theme picker, and “Send test push” on Alerts.</div>`;
document.getElementById('flow').addEventListener('click',ev=>{const b=ev.target.closest('[data-go]'); if(b) go(b.dataset.go);});
const SW=[['#0D0E12','Canvas'],['#14161C','Card'],['#262A33','Hairline'],['#E6E8EC','Ink'],['#FFB000','Accent · alert, CTA'],['#00FF66','Gain, bullish'],['#FF3B4E','Shock, loss'],['#22D3EE','Freeze, cold']];
document.getElementById('ds').innerHTML=`<div class="lbl" style="font:600 11px 'IBM Plex Mono';letter-spacing:.1em;color:#FFB000">TERMINALCAST · DESIGN SYSTEM</div>
<div style="font:600 26px/1.15 'IBM Plex Sans';margin:6px 0 12px">Institutional density, thumb-sized targets.</div>
<h3>COLOR · SEMANTICS</h3><div class="sw8">${SW.map(s=>`<div class="sc"><div style="background:${s[0]}"></div><div>${s[0]}<small>${s[1]}</small></div></div>`).join('')}</div>
<h3>THEMES (SETTINGS → APPEARANCE)</h3><p>Three themes swap surfaces and the accent only. Gain, loss and cold keep fixed meaning so risk colors never drift. Arctic swaps cold to amber so it stays distinct from the cyan accent.</p>
<h3>TYPE</h3><p><b>IBM Plex Sans</b> 500/600 for titles and copy. <b>IBM Plex Mono</b> 400–600 for every number, label and ticker. Section labels: Mono 600 11, caps, +10% tracking.</p>
<h3>RULES</h3><p>Accent = action, tickers, alerts. One filled accent CTA per screen.</p><p>Surfaces step bg → card → raised with 1px lines. No shadows except the CTA glow.</p><p>Targets ≥ 44pt. Every state has an empty, error or disabled form (bad login, no cities, no alert rules).</p><p>Navigation: 5-tab bar (Home, Map, Cities, Alerts, Settings). Arbitrage is a bottom sheet from the Map CTA.</p>
<h3>CHANGES FROM HANDOFF</h3><p>Added Log in, Sign up, Alerts and Settings. Watch became Cities with add and remove. Radar moved from a tab to the Map CTA to free a slot for Alerts.</p>`;
render();
</script>
</body>
</html>
